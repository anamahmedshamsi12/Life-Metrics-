services:
  - type: web
    name: life-metrics
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir src app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: life-metrics-db
          property: connectionString

databases:
  - name: life-metrics-db
    plan: free
